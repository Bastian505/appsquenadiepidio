<script>
  // Si algo falla en el navegador queda registrado y se muestra en pantalla (ayuda a encontrar fallos en teléfonos reales).
  window.__errs = [];
  window.addEventListener('error', function (e) { window.__errs.push((e.message || 'error') + (e.filename ? ' @' + String(e.filename).split('/').pop() + ':' + e.lineno : '')); });
  window.addEventListener('unhandledrejection', function (e) { window.__errs.push('promesa: ' + String(e.reason && (e.reason.message || e.reason)).slice(0, 120)); });
</script>

<body>
<div class="splash" id="splash" aria-hidden="true">
  <svg class="splash-icon" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M14 6h36v52l-6-4-6 4-6-4-6 4-6-4-6 4z" fill="rgba(255,181,71,.12)"/><path d="M22 18h20M22 27h20M22 36h12"/><path d="M32 44v.01"/></svg>
  <div class="splash-logo">Divi<em>Cuenta</em></div>
  <div class="splash-sub">Saca la foto. Nosotros hacemos la matemática.</div>
</div>
<script>try { if (sessionStorage.getItem('dc_splash')) document.getElementById('splash').className += ' hidden gone'; } catch (e) {}</script>
<main id="app" aria-live="polite"></main>
<div id="toast" role="status"></div>
<script src="/v2/app.js" defer></script>
</body>
