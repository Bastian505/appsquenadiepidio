<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>comandante.apps — Mis herramientas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TOPBAR -->
  <header class="topbar">
    <a class="topbar-logo" href="index.html">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      </div>
      <span class="logo-text">carepug<span>.apps</span></span>
    </a>
    <span class="topbar-badge" id="app-count">4 apps</span>
  </header>

  <!-- HERO -->
  <div class="hero">
    <span class="hero-emoji">🚀</span>
    <h1 class="hero-title">Mis <span>apps</span></h1>
    <p class="hero-subtitle">Una colección de apps simples, útiles y listas para usar.</p>
    <div class="hero-divider"></div>
  </div>

  <!-- APPS -->
  <main class="section">
    <div class="section-label">Todas las apps</div>
    <div class="apps-grid">

      <!-- App 2: Divicuenta -->
      <a class="app-item" href="apps/divicuenta/index.html">
        <div class="app-icon" style="background: linear-gradient(145deg, #38bdf8, #0ea5e9);">
          <div class="badge">nuevo</div>
          <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        </div>
        <span class="app-name">Divicuenta</span>
      </a>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    hecho con 💙 en Antofagasta
  </footer>

</body>
</html>
