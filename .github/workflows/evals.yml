name: Evals OCR

# Corre services/ocr/evals/run.mjs contra la API de Claude con las boletas reales del repo.
# Solo se ejecuta a mano (botón "Run workflow"); necesita el secreto ANTHROPIC_API_KEY.
on:
  workflow_dispatch:
    inputs:
      country:
        description: "Código de país (ej. PK). Vacío = todos"
        required: false
        default: ""
      model:
        description: "Modelo"
        required: false
        default: "claude-sonnet-4-6"
      retry_model:
        description: "Modelo de la segunda lectura en modo pipeline (vacío = el mismo)"
        required: false
        default: ""
      retry:
        description: "true = encender la segunda lectura (por defecto apagada, igual que en producción)"
        required: false
        default: "false"
      pipeline:
        description: "true = pasar por el mismo flujo de la app (reconciliación y segunda lectura incluidas)"
        required: false
        default: "false"
      extra_env:
        description: "Variables extra del lector, separadas por coma (ej. OCR_CACHE=0,OCR_PROMPT_LAYOUT=split,OCR_CASCADE_MODEL=claude-sonnet-5-5,OCR_EFFORT=low)"
        required: false
        default: ""

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Correr evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COUNTRY: ${{ inputs.country }}
          MODEL: ${{ inputs.model }}
          PIPELINE: ${{ inputs.pipeline }}
          OCR_RETRY_MODEL: ${{ inputs.retry_model }}
          OCR_RETRY: ${{ inputs.retry == 'true' && '1' || '0' }}
          EXTRA_ENV: ${{ inputs.extra_env }}
        run: |
          set -o pipefail
          if [ -n "$EXTRA_ENV" ]; then
            IFS=',' read -ra KV <<< "$EXTRA_ENV"
            for kv in "${KV[@]}"; do k="${kv%%=*}"; v="${kv#*=}"; case "$k" in OCR_*) export "$k=$v" ;; esac; done
          fi
          ARGS="--model=$MODEL"
          if [ -n "$COUNTRY" ]; then ARGS="$ARGS --country=$COUNTRY"; fi
          if [ "$PIPELINE" = "true" ]; then ARGS="$ARGS --pipeline"; fi
          node services/ocr/evals/run.mjs $ARGS | tee evals-output.txt
      - name: Resumen
        if: always()
        run: |
          echo '### Evals OCR' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat evals-output.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evals-resultados
          path: |
            evals-output.txt
            services/ocr/evals/results.*.json
