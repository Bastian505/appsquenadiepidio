name: Evals asignar hablando
on:
  workflow_dispatch:
    inputs:
      model:
        description: Modelo a medir
        default: claude-haiku-4-5
jobs:
  assign:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node services/ocr/evals/assign.mjs --model="$MODEL"
