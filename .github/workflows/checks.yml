name: Checks

# Chequeos rápidos sin API ni secretos: monedas/símbolos sincronizados y cálculo del reparto de cuentas.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  currencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/check-currencies.mjs
      - run: node tests/check-split.mjs
