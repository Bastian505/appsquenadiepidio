name: Checks

# Chequeos sin API ni secretos: monedas, cálculo del reparto y prueba de punta a punta en Chromium (tamaño celular).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  currencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/check-currencies.mjs
      - run: node tests/check-split.mjs
      - run: node tests/check-split-core.mjs
      - run: node tests/check-reconcile.mjs
      - run: node tests/check-retry.mjs

  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Pruebas de seguridad de las cuentas compartidas
        env: { PGPASSWORD: postgres }
        run: PGHOST=localhost PGPORT=5432 PGUSER=postgres bash tests/check-sql.sh

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p e2e-capturas && E2E_OUT=e2e-capturas node tests/e2e.mjs
      - run: E2E_OUT=e2e-capturas node tests/e2e-v2.mjs
      - run: E2E_OUT=e2e-capturas E2E_DARK=1 node tests/e2e-v2.mjs
      - run: E2E_OUT=e2e-capturas node tests/e2e-shared.mjs
      - run: node tests/e2e-boot.mjs
      - run: node tests/e2e-pwa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-capturas
          path: e2e-capturas
